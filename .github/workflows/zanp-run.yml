# .github/workflows/zanp-run.yml
#
# De uurlijkse run van ZANP, de nieuwsdienst. Staat LOS van de
# dagelijkse pitchrun (dagelijkse-run.yml):
#
#              | dagelijkse run (pitch)             | deze run (ZANP)
#   ---------- | ---------------------------------- | ------------------------------
#   draait     | elke nacht                         | elk uur
#   schrijft   | pitches, feed, nieuws-lokaal,      | berichten, agenda,
#              | nieuws-landelijk, bron-gezondheid  | zanp-status
#
# Een run scrapet niet elke bron: rustige bronnen en agendabronnen één keer
# per dag, de rest elke run (zie kern/zanp.js).
#
# Minuten 7 en 37 en niet 0 en 30: geplande runs rond het hele uur worden bij
# drukte op GitHub vaak vertraagd. De exacte starttijd is nooit gegarandeerd;
# reken op "binnen het uur" en niet op een flits.
#
# Instellen (optioneel), in Settings > Secrets and variables > Actions >
# Variables:
#   ALERT_MODUS   "log" (standaard: alerts alleen berekenen en loggen) of "aan"
#                 (rode en oranje balken tonen). Begin met "log".
#   ZANP_DAGCAP   AI-aanroepen per dag voor ZANP (standaard 80). Het gratis
#                 Gemini-quotum wordt gedeeld met de pitchrun; houd dit getal
#                 ruim onder je limiet in AI Studio.
#   ZANP_RUNCAP   AI-aanroepen per run (standaard 25).
#   ZANP_MODELLEN_LICHT / ZANP_MODELLEN_ZWAAR  de Gemini-modellen per klasse, gescheiden
#                 door komma's: eerste keus eerst, dan de reserves. Leeg = de standaard
#                 uit gemini.js (zie docs/PLAN.md, "AI-modellen"). Een naam die Google niet
#                 kent, wordt overgeslagen.
#   ZANP_CAP_LICHT / ZANP_CAP_ZWAAR  hoogstens zoveel verzoeken per dag per model
#                 (standaard 300 en 15; de echte limieten zijn 500 en 20).
#   ZANP_DOSSIER_MODUS  "log" (standaard: dossiers berekenen en bewaren, maar de
#                 app toont ze niet), "aan" (tab Dossiers tonen) of "uit".
#   ZANP_SAMENGESTELD_MODUS  Samengesteld nieuws (nieuws dat binnen 72 uur op twee van De Orkaan,
#                 Rodi en Zaanstad Nieuws staat): "schaduw" (standaard: berekenen en bewaren
#                 in data/zanp-samengesteld.json, niets in de stroom), "aan" of "uit".
#   ZANP_SAMENGESTELD_MAX  hoogstens zoveel AI-oordelen per run (standaard 3).
#   ZANP_BESLUITENLIJST_MODUS  Besluitenlijst van de raadsvergadering (iBabs Zaanstad): "schaduw"
#                 (standaard: alles doen en bewaren in data/zanp-besluitenlijsten.json, niets in de
#                 stroom), "aan" of "uit". ZANP_BESLUITENLIJST_MAX: hoogstens zoveel AI-verzoeken per run (6).
#   ZANP_VERSLAG_MODUS  Verslag van de raadsvergadering (ongeveer een week later online): "schaduw"
#                 (standaard: alles doen en bewaren in data/zanp-verslagen.json, niets in de stroom),
#                 "aan" of "uit". ZANP_VERSLAG_MAX: hoogstens zoveel AI-verzoeken per run (8).
#   ZANP_ROOD_ROUTES  Rood volgens het persalarm, met meerdere routes (brekend,
#                 uitkomst, gepland moment, breed opgepikt): "schaduw" (standaard:
#                 rekenen en loggen in data/zanp-prioriteit/routelog.json, niets
#                 kleuren), "aan" (alleen deze routes kleuren; de oude formule
#                 kleurt dan niets) of "uit".
#   ZANP_ROOD_AI_VETO  "1": de AI mag een route-rood tegenhouden. Standaard 0: de
#                 AI-controle wordt alleen gelogd.
#   ZANP_VERHAAL_AI  "0": de AI helpt niet bij het indelen van losse stukken in
#                 verhalen. Standaard 1 (alleen met een API-sleutel).
#   ZANP_BEWIJS   "0": Rodi en Zaanstad.nieuws niet ophalen. Standaard 1. Die twee
#                 bronnen tellen alleen mee als bewijs van aandacht en komen nooit
#                 in de nieuwsdienst of de agenda.
#
# Handmatig starten kan ook (Actions-tab); kies "alles" om ook de rustige
# bronnen en agendabronnen te scrapen.

name: ZANP nieuwsdienst

on:
  workflow_dispatch:
    inputs:
      alles:
        description: "Alle bronnen scrapen, ook de rustige bronnen en agendabronnen"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "7 * * * *"

# Eén ZANP-run tegelijk. Een nieuwe run wacht op de lopende; wachten er al
# meer, dan blijft alleen de nieuwste over (oude gegevens zijn niet nuttig).
# Een eigen groep: de dagelijkse run en deze run mogen elkaar niet blokkeren
# en ook niet elkaars wachtende run vervangen.
concurrency:
  group: zanp-run
  cancel-in-progress: false

permissions:
  contents: write # nodig om data/zaanstad/berichten.json, agenda.json en zanp-status.json te committen

jobs:
  zanp:
    runs-on: ubuntu-latest
    # Een normale run duurt een paar minuten. Hang je langer, dan is er iets mis.
    timeout-minutes: 25
    env:
      # Zelfde tijdzone als de dagelijkse run: de scrapers lezen datums in
      # Nederlandse tijd.
      TZ: Europe/Amsterdam
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies installeren
        working-directory: kern
        run: npm install --no-audit --no-fund

      - name: Bronbestanden valideren
        working-directory: kern
        run: node gereedschap/valideer-bronnen.js

      # Alleen een waarschuwing: een fout in rubrieken.json mag de run niet
      # stoppen (zanp.js valt dan terug op de veilige standaard).
      - name: rubrieken.json controleren
        continue-on-error: true
        working-directory: kern
        run: node gereedschap/valideer-rubrieken.js

      - name: ZANP-run
        working-directory: kern
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALERT_MODUS: ${{ vars.ALERT_MODUS || 'log' }}
          ZANP_ALLES: ${{ inputs.alles && '1' || '' }}
          # Leeg betekent: de standaard uit zanp.js (80 per dag, 25 per run).
          ZANP_DAGCAP: ${{ vars.ZANP_DAGCAP }}
          ZANP_RUNCAP: ${{ vars.ZANP_RUNCAP }}
          # Gemini-modellen per klasse en dagcap per model: leeg = de standaard uit gemini.js.
          ZANP_MODELLEN_LICHT: ${{ vars.ZANP_MODELLEN_LICHT }}
          ZANP_MODELLEN_ZWAAR: ${{ vars.ZANP_MODELLEN_ZWAAR }}
          ZANP_CAP_LICHT: ${{ vars.ZANP_CAP_LICHT }}
          ZANP_CAP_ZWAAR: ${{ vars.ZANP_CAP_ZWAAR }}
          # Prioriteit (rood kleuren): uit, schaduw of aan. Leeg = schaduw (rekenen en loggen, niets kleuren).
          ZANP_PRIORITEIT_MODUS: ${{ vars.ZANP_PRIORITEIT_MODUS }}
          ZANP_DOSSIER_MODUS: ${{ vars.ZANP_DOSSIER_MODUS }}
          ZANP_SAMENGESTELD_MODUS: ${{ vars.ZANP_SAMENGESTELD_MODUS }}
          ZANP_SAMENGESTELD_MAX: ${{ vars.ZANP_SAMENGESTELD_MAX }}
          ZANP_BESLUITENLIJST_MODUS: ${{ vars.ZANP_BESLUITENLIJST_MODUS }}
          ZANP_BESLUITENLIJST_MAX: ${{ vars.ZANP_BESLUITENLIJST_MAX }}
          ZANP_VERSLAG_MODUS: ${{ vars.ZANP_VERSLAG_MODUS }}
          ZANP_VERSLAG_MAX: ${{ vars.ZANP_VERSLAG_MAX }}
          # Rood volgens het persalarm: leeg = schaduw. Zie de uitleg bovenaan.
          ZANP_ROOD_ROUTES: ${{ vars.ZANP_ROOD_ROUTES }}
          ZANP_ROOD_AI_VETO: ${{ vars.ZANP_ROOD_AI_VETO }}
          ZANP_VERHAAL_AI: ${{ vars.ZANP_VERHAAL_AI }}
          ZANP_BEWIJS: ${{ vars.ZANP_BEWIJS }}
        run: node zanp.js

      # Alleen de map van deze gemeente (data/zaanstad/): daar schrijft de run al zijn bestanden.
      - name: Resultaten committen
        run: |
          git config user.name "nieuwsaggregator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/zaanstad
          git diff --quiet --cached || git commit -m "ZANP: $(TZ='Europe/Amsterdam' date '+%Y-%m-%d %H:%M')"
          # De dagelijkse run of "Bron toevoegen" kan tussentijds hebben gepusht:
          # eerst rebasen, bij een mislukte push opnieuw proberen.
          gelukt=0
          for poging in 1 2 3 4; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then gelukt=1; break; fi
            echo "Push mislukte (poging $poging van 4), opnieuw proberen..."
            sleep $((poging * 5))
          done
          if [ "$gelukt" != "1" ]; then
            echo "::error::Pushen mislukte na 4 pogingen"
            exit 1
          fi
